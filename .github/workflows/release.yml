name: Build desktop app

# Releases are driven by the version in desktop/package.json.
# Bump that number and push to main: if no release exists for it yet,
# this builds the Windows installer and publishes a GitHub Release (and its tag).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$VERSION already released, nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Building v$VERSION."
          fi

  windows:
    needs: check
    if: needs.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build installer
        working-directory: desktop
        run: npm run dist
      - name: Publish release
        if: needs.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Patchbay v${{ needs.check.outputs.version }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            desktop/dist/Patchbay-Setup-*.exe
            desktop/dist/Patchbay-Portable-*.exe
