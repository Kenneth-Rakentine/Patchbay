name: Build desktop app

# Push a tag like v1.0.1 to build the Windows installer and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build installer
        working-directory: desktop
        run: npm run dist
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Patchbay ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            desktop/dist/Patchbay-Setup-*.exe
            desktop/dist/Patchbay-Portable-*.exe
      - name: Keep build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: patchbay-windows
          path: desktop/dist/*.exe
